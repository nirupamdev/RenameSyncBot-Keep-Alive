name: Keep HF Space Warm

on:
  schedule:
    # Every 6 hours
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: hf-space-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SPACE_URL: ${{ secrets.SPACE_URL }}

    steps:
      - name: Wake the Space with retry
        run: |
          set -euo pipefail

          url="${SPACE_URL%/}/"
          echo "Pinging $url"

          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -L \
              -o /tmp/resp.txt \
              -w "%{http_code}" \
              --max-time 90 \
              "$url" || echo "000")

            echo "attempt=$attempt http=$code"

            if [ "$code" = "200" ]; then
              echo "✅ Space is awake."
              cat /tmp/resp.txt
              exit 0
            fi

            sleep 20
          done

          echo "::error::Space did not respond after 6 attempts."
          exit 1
